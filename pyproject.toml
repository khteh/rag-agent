[project]
name = "rag-agent"
version = "1.0.0"
description = "Python LLM-RAG ReAct agent using LangChain, LangGraph and LangSmith built on Quart web microframework and served using Hypercorn ASGI and WSGI web server."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "PyJWT",
    "langchain-text-splitters",
    "langchain-community",
    "langgraph",
    "python-dotenv",
    "beautifulsoup4",
    "langchain-google-genai",
    "google-genai",
    "pillow",
    "quart",
    "quart-bcrypt",
    "quart-trio",
    "quart-wtforms",
    "Quart-CORS",
    "langgraph-checkpoint-postgres",
    "langchain-core",
    "aioquic",
    "pydantic[email]",
    "neo4j",
    "retry",
    "langchain-neo4j",
    "jsonpickle",
    "databricks-sdk",
    "langchain-ollama",
    "uuid7",
    "hypercorn[h3,trio]",
    "langchain-postgres",
    "mlflow",
    "psycopg[binary,pool]",
    "deepagents",
    "google-api-core",
    "grpcio-status",
    "flask-sqlalchemy",
    "quart-flask-patch",
    "marshmallow",
    "marshmallow-sqlalchemy",
    "langmem",
    "nest-asyncio2>=1.7.2",
    "graphdatascience[networkx,ogb,rust-ext]>=1.22",
]

[dependency-groups]
dev = [
    "pytest-flask",
    "pytest",
    "pytest-asyncio",
    "langgraph-cli[inmem]",
    "langgraph-api>=0.16.1",
    "atheris>=3.0.0",
    "coverage>=7.13.5",
]
# This is an application, not a library: don't try to build/install it as an
# importable package. `uv sync` just provisions a venv with the deps above.
[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test"]
